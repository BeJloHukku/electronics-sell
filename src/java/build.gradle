plugins {
    id 'application'
}

group = 'ru.mirea'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.5'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'ru.mirea.orders.Main'
}
